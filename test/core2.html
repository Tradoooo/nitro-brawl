<!DOCTYPE html><html><head><meta charset="utf-8"><title>core2</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden}canvas{width:100%;height:100%;display:block}</style>
</head><body><canvas id="gl"></canvas>
<script src="../src/math.js"></script><script src="../src/gl.js"></script><script src="../src/mesh.js"></script>
<script>
var M=NB.M,out={};
var cv=document.getElementById('gl');NB.gl.init(cv);var W=1280,H=800;NB.gl.resize(W,H,1);var gl=NB.gl.gl();
var box=NB.gl.createMesh(NB.mesh.box(1.2,1.2,1.2,[0.8,0.45,0.2]));
var crate=NB.gl.createMesh(NB.mesh.crate(1.2,[0.8,0.45,0.2]));
var ground=NB.gl.createMesh(NB.mesh.box(30,0.4,30,[0.3,0.32,0.36]));
function panel(i,cam,fn){var pw=W/2;gl.enable(gl.SCISSOR_TEST);gl.scissor(i*pw,0,pw,H);gl.viewport(i*pw,0,pw,H);cam.aspect=pw/H;NB.gl.begin(cam);fn();NB.gl.end();gl.disable(gl.SCISSOR_TEST);}
var base={fov:1.0,skyTop:[0.2,0.3,0.6],skyBottom:[0.8,0.8,0.9],fogColor:[0.6,0.65,0.8],sunDir:[0.5,0.8,0.3],ambient:0.55,fogNear:30,fogFar:90};
function camAt(p,t){var c={};for(var k in base)c[k]=base[k];c.pos=p;c.target=t;return c;}
panel(0,camAt([2.2,1.2,2.2],[0,0.6,0]),function(){NB.gl.draw(ground,M.fromTranslation(M.create(),[0,-0.2,0]));NB.gl.draw(box,M.fromTranslation(M.create(),[0,0.6,0]));});
panel(1,camAt([2.2,1.2,2.2],[0,0.6,0]),function(){NB.gl.draw(ground,M.fromTranslation(M.create(),[0,-0.2,0]));NB.gl.draw(crate,null);});
out.ok=true;out.calls=NB.gl.stats.calls;out.tris=Math.round(NB.gl.stats.tris);
document.title='CORE2 '+JSON.stringify(out);
</script></body></html>
