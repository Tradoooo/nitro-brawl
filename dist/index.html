<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<meta name="description" content="Nitro Brawl — arène de karts armés : 8 pilotes, power-ups, éliminations. Jouable au clavier, à la souris, au tactile et à la manette. Rendu Three.js.">
<title>NITRO BRAWL — Kart Arena Brawl</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0e1a;color:#eaf0ff;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui button,#ui a,#ui input,#ui [data-click]{pointer-events:auto}
#touch{position:fixed;inset:0;pointer-events:none;z-index:20}
.nb-hidden{display:none !important}
@keyframes nbPop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes nbSlide{from{transform:translateX(28px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes nbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui"></div>
<div id="touch"></div>

  H.init = function () {
    if (typeof document === 'undefined' || H.done) return;
    H.done = true;
    H.injectCSS();
    ui = document.getElementById('ui');
    touch = document.getElementById('touch');
    ui.innerHTML = '<div id="hud" class="nb-hidden">' +
      '<div class="hud-box" id="hud-clock">3:00<small id="hud-mode">DEATHMATCH</small></div>' +
      '<div class="hud-box" id="hud-map"></div>' +

      '<div id="center"></div><div id="flash"></div><div id="threat">️</div>' +
      '<canvas id="overlay"></canvas></div><div id="screens"></div>';
    els.hud = ui.querySelector('#hud');

    overlay = ui.querySelector('#overlay'); octx = overlay.getContext('2d');

      NB.audio.ui('click');
      if (NB.game.phase === 'playing') NB.main.setPhase('paused');
      else if (NB.game.phase === 'paused') H.onInput.onResume && H.onInput.onResume();
    });
    NB.util.eventBus.on('hitflash', function (c) { flashT = 0.35; flashColor = c || [1, 0.2, 0.2]; });
    NB.util.eventBus.on('phase', function (p) {
      els.hud.classList.toggle('nb-hidden', p === 'menu');

  function sizeOverlay() {
    if (!overlay) return;
    overlay.width = window.innerWidth; overlay.height = window.innerHeight;
  }

  // ---------- écrans ----------
  H.screen = function (name, data) {
    if (!ui) return;
    var s = els.screens;
    s.innerHTML = '';
    if (name === 'playing') return;
    var wrap = el('div', 'nb-screen');
    var panel = el('div', 'nb-panel');
    wrap.appendChild(panel);
    s.appendChild(wrap);
    if (name === 'menu') menuScreen(panel);
    else if (name === 'maps') mapsScreen(panel);
    else if (name === 'mode') modeScreen(panel);
    else if (name === 'customize') customizeScreen(panel);
    else if (name === 'help') helpScreen(panel);
    else if (name === 'paused') pausedScreen(panel);
    else if (name === 'results') resultsScreen(panel, data);
  };

  function title(panel, t, sub) {
    panel.appendChild(el('h1', 'nb-title', t));
    if (sub) panel.appendChild(el('div', 'nb-sub', sub));
  }

  function btn(panel, label, cls, fn) {
    var b = el('button', 'nb-btn ' + (cls || ''), label);
    b.addEventListener('click', function () { NB.audio.ui('click'); fn(); });
    b.addEventListener('mouseenter', function () { NB.audio.ui('hover'); });
    panel.appendChild(b);
    return b;
  }

    title(p, 'NITRO BRAWL', 'Kart Arena Brawl — 1 joueur + 7 bots');
    btn(p, '▶ JOUER', '', function () {
      var s = H.persist.get();
      H.onInput.onStart && H.onInput.onStart(s.mapId, s.mode, s.difficulty);
    });
    btn(p, '🗺 ARÈNES', 'ghost', function () { H.screen('maps'); });
    btn(p, '🏁 MODE DE JEU', 'ghost', function () { H.screen('mode'); });
    btn(p, '🎨 PILOTE & DIFFICULTÉ', 'ghost', function () { H.screen('customize'); });
    btn(p, '❓ AIDE', 'ghost', function () { H.screen('help'); });
    var st = NB.util.store.get('nb.audio', {});
    btn(p, (st.enabled === false ? '🔇' : '🔊') + ' SON', 'ghost', function () {
      var cur = NB.util.store.get('nb.audio', {});
      NB.audio.setEnabled(cur.enabled === false);
      H.screen('menu');

      });
      row.appendChild(card);

    btn(p, '🗺 CHANGER D\'ARÈNE', 'ghost', function () { H.screen('maps'); });

  function resultsScreen(p, data) {
    if (!data) return;
    var medals = ['🥇', '', ''];
    title(p, data.winner && data.winner.isPlayer ? 'VICTOIRE !' : 'MANCHE TERMINÉE');
    p.appendChild(el('div', 'nb-medal', (data.winner && data.winner.isPlayer) ? '🏆' : medals[Math.min(2, data.playerRank - 1)] || '🏁'));
    p.appendChild(el('div', 'nb-sub', data.map + ' · ' + data.mode + ' · ta place : ' + data.playerRank + '/' + data.rows.length));
    var t = el('table', 'nb-table');
    var head = '<tr><th>#</th><th>Pilote</th><th>Kills</th><th>Morts</th></tr>';
    var body = data.rows.map(function (r) {
      return '<tr class="' + (r.isPlayer ? 'me' : '') + '"><td>' + r.rank + '</td><td>' +
        (medals[r.rank - 1] || '') + ' ' + r.name + '</td><td>' + r.kills + '</td><td>' + r.deaths + '</td></tr>';
    }).join('');
    t.innerHTML = head + body;
    p.appendChild(t);
    btn(p, '↻ REJOUER', '', function () { H.onInput.onRestart && H.onInput.onRestart(); });
    btn(p, '🏠 MENU', 'ghost', function () { H.onInput.onMenu && H.onInput.onMenu(); });

  // ---------- HUD en jeu ----------
  H.update = function (dt) {
    var g = NB.game;
    if (!g || !els.hud) return;
    if (g.phase === 'menu') return;
    if (g.mode === 'deathmatch') els.clock.firstChild.nodeValue = NB.util.fmtClock(g.clock);
    else els.clock.firstChild.nodeValue = remaining(g) + ' EN COURSE';
    els.mode.textContent = g.mode === 'deathmatch' ? 'DEATHMATCH' : 'ÉLIMINATION';
    els.map.textContent = (g.map ? g.map.name : '').toUpperCase();
    var rank = playerRank(g);
    els.rank.innerHTML = 'POS <b>' + rank + '/' + g.karts.length + '</b> · ☠ ' + (g.player ? g.player.kills : 0) +
      ' · 💀 ' + (g.player ? g.player.deaths : 0);
    var st = g.player ? NB.kart.stats(g.player) : { speedKmh: 0 };
    els.speed.textContent = Math.round(st.speedKmh) + ' km/h';
    var w = g.player ? g.player.weapon : null;
    els.weapon.innerHTML = w ? '<span class="ico">' + NB.pickups.ICONS[w] + '</span>' + NB.pickups.NAMES[w] : '<span class="ico" style="opacity:.25">·</span>aucune arme';
    drawMinimap();
    drawOverlay(g, dt);
    if (flashT > 0) {
      flashT -= dt;
      els.flash.style.opacity = Math.max(0, flashT / 0.35) * 0.4;
      els.flash.style.background = 'rgb(' + (flashColor[0] * 255 | 0) + ',' + (flashColor[1] * 255 | 0) + ',' + (flashColor[2] * 255 | 0) + ')';
    } else els.flash.style.opacity = 0;
    if (centerT > 0) { centerT -= dt; if (centerT <= 0) els.center.textContent = ''; }
    threatArrow(g);
  };

  function remaining(g) {
    var n = 0;
    for (var i = 0; i < g.karts.length; i++) if (!g.karts[i].out) n++;
    return n;
  }

  function playerRank(g) {
    var r = 1;
    for (var i = 0; i < g.karts.length; i++) if (g.karts[i].kills > g.player.kills) r++;
    return r;
  }

  function threatArrow(g) {
    var t = null;
    var ps = g.projectiles || [];
    for (var i = 0; i < ps.length; i++) {
      if (ps[i].kind === 'homing' && ps[i].targetId === 0) { t = ps[i]; break; }
    }
    if (!t) { els.threat.style.display = 'none'; return; }
    var d = NB.M.dist(t.pos, g.player.pos);
    if (d > 30) { els.threat.style.display = 'none'; return; }
    var ang = Math.atan2(t.pos[2] - g.player.pos[2], t.pos[0] - g.player.pos[0]) - g.player.yaw;
    els.threat.style.display = 'block';
    els.threat.style.transform = 'translate(-50%,-50%) rotate(' + (ang * 180 / Math.PI + 90) + 'deg) translateY(-90px)';
  }

  H.drawMinimap = function () { drawMinimap(); };

  function drawMinimap() {
    var g = NB.game;
    if (!mctx || !g || !g.arena) return;
    g.arena.drawMinimap(mctx, 0, 0, 150);
    var b = g.arena.bounds;
    var sc = 150 / Math.max(b.maxX - b.minX, b.maxZ - b.minZ);
    function px(v) { return 75 + v * sc; }
    var i;
    for (i = 0; i < NB.pickups.list.length; i++) {
      var p = NB.pickups.list[i];
      if (p.taken) continue;
      mctx.fillStyle = 'rgba(255,220,90,.9)';
      mctx.fillRect(px(p.pos[0]) - 1.5, px(p.pos[2]) - 1.5, 3, 3);
    }
    for (i = 0; i < g.karts.length; i++) {
      var k = g.karts[i];
      if (!k.alive) continue;
      mctx.fillStyle = k.isPlayer ? '#ffffff' : 'rgb(' + (k.color[0] * 255 | 0) + ',' + (k.color[1] * 255 | 0) + ',' + (k.color[2] * 255 | 0) + ')';
      mctx.beginPath();

    var drifting = k.drift && Math.abs(k.steer) > 0.3 && k.speed > 8;
    return drifting ? Math.min(1, Math.abs(k.speed) / 24) : (k.oilT > 0 ? 0.5 : 0);
  }

  function tickCountdown(g) {
    var n = Math.ceil(g.countdown - 0.6);
    if (n !== g.lastCount && n >= 1 && n <= 3) {
      g.lastCount = n;
      g.events.push({ t: 'count', n: n });
    }
    if (g.countdown <= 0) {
      setPhase('playing');
      g.events.push({ t: 'go' });
    }
  }

  function tickClock(g, dt) {
    if (g.mode === 'deathmatch') {
      g.clock -= dt;
      if (g.clock <= 0) { g.clock = 0; finish(g); }
    } else {
      var aliveCount = 0, last = null;
      for (var i = 0; i < g.karts.length; i++) {
        if (!g.karts[i].out) { aliveCount++; last = g.karts[i]; }
      }
      if (aliveCount <= 1 && g.karts.length > 1) { finish(g, last); }
    }
  }

  function stepKarts(g, dt, live) {
    for (var i = 0; i < g.karts.length; i++) {
      var k = g.karts[i];
      var inp = NEUTRAL;
      if (live && k.alive) {
        if (k.isBot || (G.autopilot && k.isPlayer)) {
          inp = NB.bots.update(k, dt) || NEUTRAL;
          if (inp.fire) tryFire(k);
          if (inp.use) tryUse(k);
          inp.fire = false; inp.use = false;
        } else {
          inp = playerInput(g, k, dt);
        }
      }
      NB.kart.update(k, inp, dt);
      if (!k.alive && k.respawnIn <= 0 && !k.out) respawn(g, k);
    }
  }

  var NEUTRAL = { throttle: 0, brake: 0, steer: 0, drift: false, fire: false, use: false };

  function playerInput(g, k, dt) {
    var inp = NB.input.read();
    if (NB.input.pressed('KeyR')) { k.respawnIn = 0.05; }
    if (NB.input.pressed('Escape')) setPhase(g.phase === 'paused' ? 'playing' : 'paused');
    var id = k.id;
    var fireEdge = inp.fire && !prevFire[id];
    var useEdge = inp.use && !prevUse[id];
    prevFire[id] = inp.fire; prevUse[id] = inp.use;
    if (fireEdge) tryFire(k);
    if (useEdge) tryUse(k);
    inp.fire = false; inp.use = false;
    return inp;
  }

  function tryFire(k) {
    if (!k.weapon || NB.weapons.cooldown(k)) return;
    NB.weapons.fire(k);
  }

  function tryUse(k) {
    if (k.weapon === 'shield' || k.weapon === 'boost' || k.weapon === 'ram') NB.weapons.activate(k);
  }

  function collectPickups(g) {
    for (var i = 0; i < g.karts.length; i++) {
      var k = g.karts[i];
      if (k.alive) NB.pickups.tryPick(k);
    }
  }

  function respawn(g, k) {
    var best = null, bestScore = -1;
    for (var i = 0; i < g.arena.spawns.length; i++) {
      var sp = g.arena.spawns[i];
      var d = nearestEnemyDist(g, k, sp[0], sp[1]);
      if (d > bestScore) { bestScore = d; best = sp; }
    }
    var sp2 = best || g.arena.spawns[0];
    NB.kart.reset(k, sp2[0], sp2[1], yawToCenter(sp2, g.arena));
    g.events.push({ t: 'respawn', kartId: k.id, pos: [sp2[0], 0.5, sp2[1]] });
  }

  function nearestEnemyDist(g, self, x, z) {
    var best = 1e9;
    for (var i = 0; i < g.karts.length; i++) {
      var k = g.karts[i];
      if (k === self || !k.alive) continue;
      var d = M.dist2([x, 0, z], [k.pos[0], 0, k.pos[2]]);
      if (d < best) best = d;
    }
    return best;
  }

  function dispatchEvents(g) {
    var evs = g.events;
    for (var i = 0; i < evs.length; i++) {
      var e = evs[i];
      if (e.t === 'kill') applyKill(g, e);
      NB.fx.onEvent(e);
      NB.audio.onEvent(e);
      NB.hud.onEvent(e);
    }
    evs.length = 0;
  }

  function applyKill(g, e) {
    var victim = g.karts[e.victimId];
    if (!victim) return;
    if (g.mode === 'elimination') {
      victim.lives = (victim.lives || 3) - 1;
      if (victim.lives <= 0) { victim.out = true; victim.respawnIn = 1e9; }
    }
  }

  function finish(g, forcedWinner) {
    var list = g.karts.slice().sort(function (a, b) {
      if (b.kills !== a.kills) return b.kills - a.kills;
      return a.deaths - b.deaths;
    });
    g.winner = forcedWinner || list[0];
    setPhase('finished');
    g.events.push({ t: 'matchEnd', winner: g.winner.id });
    NB.audio.music('end');
    saveBest(g, list);
    NB.hud.results(buildResults(g, list));
  }

  function saveBest(g, list) {
    var p = g.player;
    var key = 'nb.best.' + g.map.id + '.' + g.mode;
    var prev = NB.util.store.get(key, null);
    if (!prev || p.kills > prev.kills) NB.util.store.set(key, { kills: p.kills, deaths: p.deaths, at: Date.now() });
  }

  function buildResults(g, list) {
    return {
      mode: g.mode, map: g.map.name, winner: g.winner,
      playerRank: list.indexOf(g.player) + 1,
      rows: list.map(function (k, i) {
        return {
          rank: i + 1, name: k.name, kills: k.kills, deaths: k.deaths,
          color: k.color, isPlayer: k.isPlayer, lives: k.lives,
          shots: k.shots || 0, hits: k.hits || 0
        };
      })
    };
  }

  // ---------- rendu ----------
  function draw() {
    var g = NB.game;
    NB.gl.begin(NB.cam.cam);
    if (g.arena) g.arena.draw();
    NB.pickups.draw();
    NB.kart.drawAll();
    NB.weapons.draw();
    NB.fx.draw();
    NB.gl.end();
  }

  // ---------- selftest (headless) ----------
  function selftest() {
    var out = { ok: true, errors: [], frames: 0 };
    try {
      var g = NB.game;
      var mode = /[?&]mode=elim/.test(location.search) ? 'elimination' : 'deathmatch';
      var mapId = (location.search.match(/map=([a-z]+)/) || [])[1] || NB.maps.list[0].id;
      if (g.phase === 'menu') G.startMatch({ mapId: mapId, mode: mode, difficulty: 'pro' });
      g.countdown = 0; setPhase('playing');
      var n = parseInt((location.search.match(/selftest=(\d+)/) || [])[1] || '240', 10);
      var t0 = NB.util.now();
      for (var i = 0; i < n; i++) {
        g.time += 1 / 60;
        update(1 / 60);
        draw();
        out.frames++;
      }
      out.ms = Math.round((NB.util.now() - t0) * 1000);
      out.perFrame = +(out.ms / n).toFixed(2);
      out.karts = g.karts.map(function (k) {
        return { id: k.id, alive: k.alive, lives: k.lives, out: !!k.out, x: +k.pos[0].toFixed(1), z: +k.pos[2].toFixed(1), sp: +(k.speed || 0).toFixed(1), kills: k.kills };
      });
      out.moved = g.karts.filter(function (k) { return Math.abs(k.pos[0]) + Math.abs(k.pos[2]) > 0.5; }).length;
      out.calls = NB.gl.stats.calls; out.tris = Math.round(NB.gl.stats.tris); out.sprites = Math.round(NB.gl.stats.sprites);
      out.particles = NB.fx.count || 0;
      out.pickups = NB.pickups.list ? NB.pickups.list.length : 0;
      out.weapons = g.karts.map(function (k) { return k.weapon || '-'; });
      out.shots = g.karts.reduce(function (a, k) { return a + (k.shots || 0); }, 0);
      out.avgSpeed = +(g.karts.reduce(function (a, k) { return a + Math.abs(k.speed); }, 0) / g.karts.length).toFixed(1);
      out.deaths = g.karts.reduce(function (a, k) { return a + k.deaths; }, 0);
      out.projectiles = (g.projectiles || []).length;
      out.fps = Math.round(1000 / Math.max(1, out.perFrame));
      out.phase = g.phase; out.frozen = !!G.frozen; out.hidden = document.hidden;
      if (/[?&]end=1/.test(location.search)) {
        g.clock = 0;
        for (var e2 = 0; e2 < 4; e2++) { g.time += 1 / 60; update(1 / 60); }
        out.phase = g.phase;
        out.winner = g.winner ? g.winner.name : null;
      }
    } catch (e) {
      out.ok = false;
      out.errors.push(String((e && e.stack) || e));
    }
    if (/[?&]freeze=1/.test(location.search)) G.frozen = true;
    window.__SELFTEST = out;
    document.title = 'SELFTEST ' + JSON.stringify(out).slice(0, 900);
    var d = document.createElement('pre');
    d.id = 'selftest';
    d.textContent = JSON.stringify(out, null, 1);
    document.body.appendChild(d);
  }
  G.selftest = selftest;
  G.cam = NB.cam.cam;
  NB.main = G;
})(window.NB = window.NB || {});

if (typeof window !== 'undefined') {
  window.addEventListener('load', function () { NB.main.boot(); });
}

</script>
</body>
</html>
